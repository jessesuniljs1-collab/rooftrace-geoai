name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/download_model.py
      - run: ruff check .
      - run: node --check static/app.js
      - run: pytest -q
      - name: Build and exercise Docker entrypoint
        run: |
          docker build -t rooftrace-ci .
          docker run -d --rm -p 8000:8000 --name rooftrace-ci rooftrace-ci
          python - <<'PY'
          import time
          import requests
          for attempt in range(30):
              try:
                  response = requests.get('http://127.0.0.1:8000/health', timeout=2)
                  if response.status_code == 200:
                      break
              except requests.RequestException:
                  pass
              time.sleep(1)
          else:
              raise RuntimeError('Container did not become ready')
          response = requests.post('http://127.0.0.1:8000/api/analyze', data={'sample_id': 'courtyard'}, timeout=120)
          response.raise_for_status()
          result = response.json()
          assert result['count'] == len(result['regions']) and result['count'] > 0
          print('Container inference passed:', result['count'], 'regions')
          PY
      - name: Container logs
        if: failure()
        run: docker logs rooftrace-ci || true
